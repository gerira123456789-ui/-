<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消化器外科患者管理 Ver.10</title>
<style>
body{margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
header{background:white;border-bottom:1px solid #e5e7eb;padding:16px;position:sticky;top:0;z-index:10}
h1{font-size:20px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.sub,.small{font-size:12px;color:#6b7280;line-height:1.45}
main{max-width:1200px;margin:0 auto;padding:12px;display:grid;gap:12px}
.panel,.box,.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000008}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.span{grid-column:1/-1}
label{display:block;font-size:13px;color:#6b7280;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;box-sizing:border-box;background:white}
textarea{min-height:64px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:#2563eb;color:white;margin:4px;cursor:pointer}
button.gray{background:#4b5563}button.red{background:#dc2626}button.green{background:#059669}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabbtn{background:#e5e7eb;color:#1f2937}.tabbtn.active{background:#2563eb;color:white}
.tab{display:none}.tab.active{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input,.toolbar select{flex:1;min-width:150px}
.list{display:grid;gap:10px}.card{cursor:pointer}.card:hover{border-color:#2563eb}
.name{font-weight:800;font-size:16px}.meta{font-size:13px;color:#6b7280;margin-top:4px}
.badge{display:inline-block;color:white;border-radius:999px;padding:3px 8px;font-size:12px;margin:8px 4px 0 0}
.急性期{background:#dc2626}.術後{background:#d97706}.退院調整{background:#059669}.安定{background:#6b7280}
.pod{background:#7c3aed}.alert{background:#dc2626}.ok{background:#059669}.info{background:#2563eb}
.detail{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:10px}
.pre{white-space:pre-wrap;line-height:1.55;font-size:14px}
.hidden{display:none}.formPanel{display:none}.formPanel.open{display:block}
.labrow{display:grid;grid-template-columns:1fr 1fr 46px;gap:8px;margin-top:6px}.labrow button{background:#dc2626;margin:0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calhead{font-size:12px;text-align:center;color:#6b7280;font-weight:700}
.day{min-height:82px;border:1px solid #e5e7eb;border-radius:10px;background:white;padding:6px;font-size:12px}.daynum{font-weight:800}
.event{display:block;border-radius:6px;padding:2px 4px;margin-top:3px;color:white;font-size:11px}.ev-lab{background:#dc2626}.ev-op{background:#7c3aed}.ev-dis{background:#059669}.ev-test{background:#2563eb}
.warn{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px;font-size:12px;color:#7f1d1d}
@media(max-width:800px){.grid,.detail{grid-template-columns:1fr}}
</style>

<style id="readable-upgrade">
:root{--blue:#2563eb;--green:#059669;--red:#dc2626;--orange:#d97706;--purple:#7c3aed}
body{background:#f3f6fb!important;color:#172033!important}
header{background:linear-gradient(135deg,#2563eb,#1e40af)!important;color:white!important;box-shadow:0 4px 14px #0002!important}
header .sub{color:#dbeafe!important}
.panel{border-radius:18px!important;box-shadow:0 6px 18px #10182810!important}
.tabs{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:8px!important}
.tabbtn{border-radius:14px!important;padding:12px 8px!important;font-weight:900!important}
.tabbtn.active{box-shadow:0 4px 10px #2563eb40!important}
.card{border-radius:18px!important;padding:14px!important;box-shadow:0 4px 14px #1018280f!important}
.card .name{font-size:17px!important;font-weight:900!important}
.meta{line-height:1.45!important}
.badge{font-weight:900!important;padding:4px 9px!important}
.box{border-radius:16px!important;box-shadow:0 2px 8px #10182808!important}
.box h3{color:#344054!important;font-weight:900!important}
.detail{gap:10px!important}
input,select,textarea{border-radius:12px!important;font-size:15px!important}
button{border-radius:12px!important;font-weight:900!important}
.sectionTitle{grid-column:1/-1;background:#f8fafc;border:1px solid #edf2f7;border-radius:14px;padding:10px 12px;font-weight:900;color:#344054;margin-top:10px}
.readableMiniGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.readableMini{background:#f8fafc;border:1px solid #edf2f7;border-radius:12px;padding:8px;font-size:12px;color:#344054}
.readableMini b{display:block;color:#667085;font-size:12px;margin-bottom:2px}
@media(max-width:820px){.tabs{grid-template-columns:repeat(3,1fr)!important}.readableMiniGrid{grid-template-columns:1fr!important}}
</style>

</head>

<div class="sub">病棟管理・外来フォロー・カレンダー / 退院転帰・自動POD採血対応版</div>

<main>

<div class="tabs">

<button class="tabbtn" onclick="showTab('outpatient')">外来フォロー</button>
<button class="tabbtn" onclick="showTab('calendar')">カレンダー</button>
</div>

<section class="panel tab active" id="wardTab">
<div class="toolbar">
<input id="wardSearch" oninput="renderWard()" placeholder="検索：ID、病名、プロブレム、手術名">

<option>胃癌</option><option>大腸癌</option><option>直腸癌</option><option>食道癌</option><option>膵癌</option><option>胆管癌</option><option>胆嚢癌</option><option>急性胆嚢炎</option><option>急性虫垂炎</option><option>腸閉塞</option><option>大腸憩室炎</option><option>消化管穿孔</option><option>鼠径ヘルニア</option>

<div class="sectionTitle">癌症例・TNM・外来フォロー</div><div class="span"><label>癌症例</label><select id="isCancer" onchange="toggleCancer()"><option>いいえ</option><option>はい</option></select></div>

<div class="span hidden" id="cancerFields">
<div class="grid">
<div><label>癌種</label><select id="cancerType" onchange="updateCancerInfo();renderMarkers();"><option>未設定</option><option>胃癌</option><option>大腸癌</option><option>食道癌</option><option>膵癌</option><option>肝細胞癌</option><option>胆管癌</option><option>胆嚢癌</option><option>十二指腸癌</option><option>GIST</option><option>その他</option></select></div>
<div><label>分類</label><select id="tnmType"><option>未設定</option><option>cTNM</option><option>pTNM</option><option>ycTNM</option><option>ypTNM</option></select></div>
<div><label>T分類</label><select id="tClass" onchange="updateCancerInfo()"><option>TX</option><option>Tis</option><option>T1</option><option>T1a</option><option>T1b</option><option>T1c</option><option>T2</option><option>T3</option><option>T4</option><option>T4a</option><option>T4b</option></select></div>
<div><label>N分類</label><select id="nClass" onchange="updateCancerInfo()"><option>NX</option><option>N0</option><option>N1</option><option>N1a</option><option>N1b</option><option>N1c</option><option>N2</option><option>N2a</option><option>N2b</option><option>N3</option></select></div>
<div><label>M分類</label><select id="mClass" onchange="updateCancerInfo()"><option>MX</option><option>M0</option><option>M1</option><option>M1a</option><option>M1b</option><option>M1c</option></select></div>
<div><label>Stage</label><select id="stage"><option>未設定</option><option>Stage 0</option><option>Stage I</option><option>Stage IA</option><option>Stage IB</option><option>Stage II</option><option>Stage IIA</option><option>Stage IIB</option><option>Stage III</option><option>Stage IIIA</option><option>Stage IIIB</option><option>Stage IIIC</option><option>Stage IV</option></select></div>
<div class="span"><label>取扱い規約 / 版</label><input id="cancerRules" placeholder="例：胃癌取扱い規約 第15版"></div>
<div class="span"><label>TNM解説 / Stage自動判定</label><textarea id="tnmDescription" readonly></textarea></div>
<div class="span"><label>腫瘍マーカー（癌種に応じて必要項目のみ表示）</label><div id="markerBox" class="grid"></div><input type="hidden" id="cea"><input type="hidden" id="ca199"><input type="hidden" id="afp"><input type="hidden" id="pivka"><input type="hidden" id="scc"><input type="hidden" id="cyfra"><input type="hidden" id="nse"><input type="hidden" id="progrp"><input type="hidden" id="markerDate"></div>
<div class="span"><label>外来フォロー</label>
<div class="grid">
<div><label>フォロー区分</label><select id="followStatus"><option>未設定</option><option>術後フォロー中</option><option>化学療法中</option><option>経過観察</option><option>終診</option></select></div>
<div><label>術後経過</label><input id="postOpFollow" placeholder="例：術後1年2か月"></div>
<div><label>最終CT</label><input id="lastCTDate" type="date"></div>
<div><label>次回CT</label><input id="nextCTDate" type="date"></div>
<div><label>最終受診</label><input id="lastVisitDate" type="date"></div>
<div><label>次回外来</label><input id="nextVisitDate" type="date"></div>
<div class="span"><label>病理結果 / 補助療法 / フォローメモ</label><textarea id="followNote"></textarea></div>
</div>
</div>
</div>
</div>

<div class="sectionTitle">病棟管理</div><div class="span"><label>プロブレム</label><textarea id="problem" onblur="formatProblems()" placeholder="#1. 発熱&#10;#2. 食思不振"></textarea></div>
<div class="span"><label>既往歴</label><input id="history" list="historyHistory"><datalist id="historyHistory"></datalist></div>
<div><label>状態</label><select id="status"><option>急性期</option><option>術後</option><option>退院調整</option><option>安定</option></select></div>
<div><label>手術日</label><input id="operationDate" type="date" onchange="toggleSurgery();addPodLabsFromOperation(false)"></div>

<div class="span hidden" id="surgeryFields">
<div class="grid">
<div><label>心電図</label><select id="ecgStatus"><option>未設定</option><option>予定</option><option>済</option><option>不要</option><option>要再検</option></select></div>
<div><label>心電図日</label><input id="ecgDate" type="date"></div>
<div><label>心エコー</label><select id="echoStatus"><option>未設定</option><option>予定</option><option>済</option><option>不要</option><option>要再検</option></select></div>
<div><label>心エコー日</label><input id="echoDate" type="date"></div>
<div><label>呼吸機能検査</label><select id="pftStatus"><option>未設定</option><option>予定</option><option>済</option><option>不要</option><option>要再検</option></select></div>
<div><label>呼吸機能検査日</label><input id="pftDate" type="date"></div>
</div>
</div>

<div class="sectionTitle">術前検査・耐術能</div><div class="span"><label>耐術能評価</label>
<div class="grid">
<div><label>PS</label><select id="ps"><option>未設定</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<div><label>ASA-PS</label><select id="asa"><option>未設定</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<div><label>ADL</label><select id="adl"><option>未設定</option><option>自立</option><option>一部介助</option><option>全介助</option></select></div>
<div><label>フレイル</label><select id="frailty"><option>未設定</option><option>なし</option><option>軽度</option><option>中等度</option><option>高度</option></select></div>
</div>
<textarea id="surgicalRiskNote" placeholder="心肺機能、栄養、抗血栓薬など"></textarea>
</div>

<div class="span"><label>手術名 / 治療方針</label><input id="operationName" list="operationHistory"><datalist id="operationHistory">
<option>幽門側胃切除術</option><option>胃全摘術</option><option>噴門側胃切除術</option><option>結腸右半切除術</option><option>結腸左半切除術</option><option>S状結腸切除術</option><option>低位前方切除術</option><option>腹会陰式直腸切断術</option><option>膵頭十二指腸切除術</option><option>膵体尾部切除術</option><option>肝切除術</option><option>胆嚢摘出術</option><option>虫垂切除術</option><option>人工肛門造設術</option>
</datalist><textarea id="plan"></textarea></div>
<div class="sectionTitle">採血・食事・抗菌薬</div><div class="span"><label>採血日程</label><div id="labBox"></div><button class="gray" type="button" onclick="addLab()">採血日を追加</button><button class="green" type="button" onclick="addPodLabsFromOperation(true)">POD1/POD3採血を追加</button></div>
<div><label>食事</label><select id="diet"><option>未設定</option><option>絶食</option><option>飲水可</option><option>流動食</option><option>3分粥</option><option>5分粥</option><option>全粥</option><option>常食</option><option>経管栄養</option><option>TPN</option></select></div>
<div><label>食上げ予定</label><select id="dietPlan"><option>未設定</option><option>本日食上げ</option><option>明日食上げ予定</option><option>症状次第</option><option>保留</option></select></div>
<div><label>Cre</label><input id="creatinine" type="number" step="0.01" oninput="calcCrCl()"></div>
<div><label>体重</label><input id="weight" type="number" step="0.1" oninput="calcCrCl()"></div>
<div><label>CrCl</label><input id="crcl" type="number" step="0.1" oninput="updateDose()"></div>
<div><label>抗生剤</label><select id="antibiotics" onchange="updateDose()"><option></option><option>CEZ</option><option>CMZ</option><option>CTRX</option><option>TAZ/PIPC</option><option>MEPM</option><option>CFPM</option><option>LVFX</option><option>VCM</option><option>その他</option></select></div>
<div class="span"><label>用量目安</label><textarea id="antibioticDose"></textarea><div class="warn">目安です。処方時は添付文書・院内規定・TDM・透析条件を確認してください。</div></div>
<div><label>抗生剤開始日</label><input id="antibioticStart" type="date"></div>
<div><label>ドレーン</label><select id="drain"><option>なし</option><option>あり</option><option>抜去予定</option><option>要確認</option></select></div>
<div><label>DVT予防</label><select id="dvt"><option>未設定</option><option>弾性ストッキング</option><option>フットポンプ</option><option>ヘパリン</option><option>DOAC</option><option>禁忌・保留</option></select></div>
<div><label>退院予定日</label><input id="dischargeDate" type="date"></div>
<div><label>退院時転帰</label><select id="dischargeOutcome" onchange="toggleDischargeFollow()"><option>未設定</option><option>外来フォロー</option><option>転院</option><option>紹介</option><option>終診</option><option>死亡</option></select></div>
<div class="span"><label>退院後方針</label><textarea id="dischargePlan" placeholder="例：当院外来フォロー、紹介先、転院先、次回検査など"></textarea></div>
<div class="span"><label>本日のToDo</label><textarea id="todo"></textarea></div>
<div class="span"><label>注意事項</label><textarea id="alerts"></textarea></div>
</div>
<button onclick="savePatient()">保存</button><button class="gray" onclick="closeForm()">閉じる</button><button class="red" onclick="deletePatient()">削除</button>
</section>

<section class="panel tab" id="outpatientTab">
<h2>外来フォロー</h2>
<div class="toolbar"><input id="outSearch" oninput="renderOutpatient()" placeholder="検索：癌種、Stage、次回CT、マーカー"><button onclick="openNew()">新規追加</button><button class="green" onclick="showOutDue()">今後の予定</button></div>
<div id="outDashboard" class="detail"></div>
<div id="outList" class="list"></div>
</section>

<section class="panel tab" id="calendarTab">
<h2>カレンダー</h2>
<div id="calendarArea"></div>
</section>

<section class="panel">
<h2>詳細</h2>
<div id="detail" class="pre">患者カードを選択してください。</div>
</section>
</main>

<script>

const ids=["name","sex","age","referralSource","familyDoctor","diagnosis","isCancer","cancerType","tnmType","tClass","nClass","mClass","stage","cancerRules","tnmDescription","cea","ca199","afp","pivka","scc","cyfra","nse","progrp","markerDate","followStatus","postOpFollow","lastCTDate","nextCTDate","lastVisitDate","nextVisitDate","followNote","problem","history","status","operationDate","ecgStatus","ecgDate","echoStatus","echoDate","pftStatus","pftDate","ps","asa","adl","frailty","surgicalRiskNote","operationName","plan","diet","dietPlan","creatinine","weight","crcl","antibiotics","antibioticDose","antibioticStart","drain","dvt","dischargeDate","dischargeOutcome","dischargePlan","todo","alerts"];

function stageAuto(c,t,n,m){if((m||"").startsWith("M1"))return"Stage IV";if(m==="MX"||n==="NX"||t==="TX")return"未設定";if(c==="胃癌"){if(t==="Tis"&&n==="N0")return"Stage 0";if(["T1","T1a","T1b"].includes(t)&&n==="N0")return"Stage IA";if(t==="T2"&&n==="N0")return"Stage IB";if(["T1","T1a","T1b"].includes(t)&&n==="N1")return"Stage IB";if(n==="N3"||["T4","T4a","T4b"].includes(t))return"Stage III";if(n==="N1"||n==="N2")return"Stage II";return"Stage I"}if(c==="大腸癌"){if(t==="Tis"&&n==="N0")return"Stage 0";if(["T1","T2"].includes(t)&&n==="N0")return"Stage I";if(["T3","T4","T4a","T4b"].includes(t)&&n==="N0")return"Stage II";if(n.startsWith("N"))return"Stage III"}if(c==="膵癌"){if(["T1","T2"].includes(t)&&n==="N0")return"Stage I";if(t==="T3"&&n==="N0")return"Stage IIA";if(n==="N1")return"Stage IIB";if(t==="T4")return"Stage III"}return"未設定"}
function updateCancerInfo(){const c=val("cancerType"),t=val("tClass"),n=val("nClass"),m=val("mClass"),d=defs[c]||{};const st=stageAuto(c,t,n,m);if(st!="未設定")set("stage",st);set("tnmDescription",[`癌種：${c}`,`${t}：${d[t]||"定義未登録。規約で確認"}`,`${n}：${d[n]||"定義未登録。規約で確認"}`,`${m}：${d[m]||"定義未登録。規約で確認"}`,`Stage目安：${st}`,"※簡易表示"].join("\n"))}
function markerNames(c){return {"胃癌":["CEA","CA19-9"],"大腸癌":["CEA","CA19-9"],"膵癌":["CA19-9","CEA"],"肝細胞癌":["AFP","PIVKA-II"],"食道癌":["SCC","CYFRA","CEA"],"胆管癌":["CA19-9","CEA"],"胆嚢癌":["CA19-9","CEA"],"十二指腸癌":["CEA","CA19-9"],"GIST":[]}[c]||["CEA","CA19-9"]}

function events(){const e=[];patients.forEach(p=>{(p.labSchedules||[]).forEach(l=>l.date&&e.push([l.date,"ev-lab",`採血：${p.name}`]));p.operationDate&&e.push([p.operationDate,"ev-op",`手術：${p.name}`]);p.dischargeDate&&e.push([p.dischargeDate,"ev-dis",`退院：${p.name}`]);p.nextCTDate&&e.push([p.nextCTDate,"ev-test",`CT：${p.name}`]);p.nextVisitDate&&e.push([p.nextVisitDate,"ev-test",`外来：${p.name}`]);});return e}

}
function addPodLabsFromOperation(force){
  const op=val("operationDate");
  if(!op)return;
  const d1=addDays(op,1), d3=addDays(op,3);
  if(force || !labExists(d1,"POD1")) addLab(d1,"POD1 採血");
  if(force || !labExists(d3,"POD3")) addLab(d3,"POD3 採血");
}
function toggleDischargeFollow(){
  if(val("dischargeOutcome")==="外来フォロー"){
    set("isCancer", cancerLike(val("diagnosis")) ? "はい" : val("isCancer"));
    if(!val("followStatus")) set("followStatus","術後フォロー中");
    if(!val("nextVisitDate") && val("dischargeDate")) set("nextVisitDate", addDays(val("dischargeDate"),14));
    toggleCancer();
  }
}
const oldGetForm=getForm;
getForm=function(){
  const p=oldGetForm();
  if(p.dischargeOutcome==="外来フォロー"){
    if(!p.followStatus || p.followStatus==="未設定") p.followStatus="術後フォロー中";
    if(!p.nextVisitDate && p.dischargeDate) p.nextVisitDate=addDays(p.dischargeDate,14);
  }
  return p;
}
const oldShowDetail=showDetail;
showDetail=function(p){
  oldShowDetail(p);
  detail.innerHTML=detail.innerHTML.replace('</div></div></div>', `</div></div><div class="box"><h3>退院時転帰</h3><div class="pre">転帰：${esc(p.dischargeOutcome||"未設定")}\n方針：${esc(p.dischargePlan||"")}</div></div></div>`);
}
function patientEvents(p){
 const ev=[];
 (p.labSchedules||[]).forEach(l=>l.date&&ev.push([l.date,"ev-lab",`採血 ${l.memo||""}`]));
 p.operationDate&&ev.push([p.operationDate,"ev-op",`手術 ${p.operationName||""}`]);
 p.dischargeDate&&ev.push([p.dischargeDate,"ev-dis",`退院 ${p.dischargeOutcome||""}`]);
 p.nextCTDate&&ev.push([p.nextCTDate,"ev-test","次回CT"]);
 p.nextVisitDate&&ev.push([p.nextVisitDate,"ev-test","次回外来"]);
 p.ecgDate&&ev.push([p.ecgDate,"ev-test","心電図"]);
 p.echoDate&&ev.push([p.echoDate,"ev-test","心エコー"]);
 p.pftDate&&ev.push([p.pftDate,"ev-test","呼吸機能"]);
 return ev;
}
function renderCalendarEvents(ev,title){
 const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
 let s=`<div><button class="gray" onclick="calDate=new Date(${y},${m-1},1);${title.startsWith("患者別")?"showSelectedPatientCalendar()":"showCalendar()"}">前月</button><b>${title}　${y}年${m+1}月</b><button class="gray" onclick="calDate=new Date(${y},${m+1},1);${title.startsWith("患者別")?"showSelectedPatientCalendar()":"showCalendar()"}">翌月</button></div><div class="calendar">`;
 ["日","月","火","水","木","金","土"].forEach(d=>s+=`<div class="calhead">${d}</div>`);
 for(let i=0;i<first.getDay();i++)s+="<div class='day'></div>";
 for(let d=1;d<=last.getDate();d++){
  const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  s+=`<div class="day"><div class="daynum">${d}</div>`;
  ev.filter(x=>x[0]===ds).forEach(x=>s+=`<span class="event ${x[1]}">${esc(x[2])}</span>`);
  s+="</div>";
 }
 return s+"</div>";
}
function showSelectedPatientCalendar(){
  const id=val("editId")||selectedId;
  const p=patients.find(x=>x.id===id);
  if(!p){detail.innerHTML="<div class='empty'>患者を選択してください。</div>";return;}
  detail.innerHTML=renderCalendarEvents(patientEvents(p),`患者別カレンダー：${p.name}`);
}
const oldShowCalendar=showCalendar;
showCalendar=function(){
  const ev=events();
  calendarArea.innerHTML=renderCalendarEvents(ev,"全体カレンダー");
}
const oldSavePatient=savePatient;
savePatient=function(){
  toggleDischargeFollow();
  oldSavePatient();
}
</script>
